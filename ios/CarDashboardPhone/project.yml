# XcodeGen 工程定义 —— CarDashboardPhone（iPhone 数据源 App）
#
# 用法（本机需要 xcodegen）：
#   brew install xcodegen             # 仅一次
#   cd ios/CarDashboardPhone && xcodegen generate
# 产出的 CarDashboardPhone.xcodeproj 可直接用 Xcode 打开、选 Team 后真机运行。
#
# 生成的 .xcodeproj 会一并提交，因此**无 xcodegen 也能直接用 Xcode 打开**。

name: CarDashboardPhone
options:
  bundleIdPrefix: com.cardashboard
  deploymentTarget:
    iOS: "17.0"          # 用户设备 iOS 17.0.2；speedAccuracy 需 iOS 17
  createIntermediateGroups: true

targets:
  CarDashboardPhone:
    type: application
    platform: iOS
    sources:
      - CarDashboardPhone
    entitlements:
      path: CarDashboardPhone/CarDashboardPhone.entitlements
    info:
      path: CarDashboardPhone/Info.plist
      properties:
        # 主屏幕图标下的名称（中文）；CFBundleName 保持英文供系统标识使用
        CFBundleDisplayName: 车载仪表
        CFBundleName: CarDashboard
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: 驾驶会话中读取您的车速、航向与位置
        NSLocationAlwaysAndWhenInUseUsageDescription: 锁屏/后台驾驶时继续更新车速
        NSBluetoothAlwaysUsageDescription: 连接车载仪表并发送驾驶数据
        NSBluetoothPeripheralUsageDescription: 连接车载仪表并发送驾驶数据
        # 照片页要把生成的 GIF 存进相册
        NSPhotoLibraryAddUsageDescription: 把裁切生成的 GIF 保存到相册
        # PhotosPicker 本身不需要读权限，但导出后用户可能想再选回来
        NSPhotoLibraryUsageDescription: 选择图片或视频作为照片表盘的素材

        # ── 上传到仪表（192.168.4.1）必需的两个声明 ──
        #
        # ① iOS 14+ 的「本地网络权限」：App 访问私有 IP（192.168.x.x）需要它。
        #    如果 Info.plist 里**没有**这条，请求会**直接失败**且**不弹权限框**，
        #    报出来的是一个含糊的网络错误（实测为 "The network connection was lost"）。
        # ② ATS 默认禁止明文 HTTP；`NSAllowsLocalNetworking` 只放行本地网络，
        #    比 `NSAllowsArbitraryLoads` 安全（后者会把整个 App 的 HTTPS 强制都放开）。
        NSLocalNetworkUsageDescription: 上传照片到仪表（局域网内 192.168.4.1）
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - location
          - bluetooth-central
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.cardashboard.CarDashboardPhone
        CODE_SIGN_STYLE: Automatic
        # 真机签名：个人开发者 Team（Xcode 登录 Apple ID 后自动生成的 Personal Team）
        DEVELOPMENT_TEAM: QFH3X6SMV4
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  # XCUITest：驾驶会话 UI 自动化（验证 开始驾驶→定位流入→遥测计数→结束 全链路）
  CarDashboardPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CarDashboardPhoneUITests
    dependencies:
      - target: CarDashboardPhone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CarDashboardPhone:
    build:
      targets:
        CarDashboardPhone: all
    test:
      targets:
        - CarDashboardPhoneUITests
